<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8573d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>แปลการ์ตูน (ออฟไลน์)</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--mute:#6f675c;--line:#e6dfd3;--acc:#e8573d;--acc-ink:#fff;--chip:#f3ece0}
@media (prefers-color-scheme:dark){:root{--bg:#17140f;--card:#221e17;--ink:#f3ece0;--mute:#a79d8c;--line:#3a3328;--acc:#ff7a5e;--acc-ink:#1a1006;--chip:#2c261d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.55;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--mute);cursor:pointer;padding:22px 16px}
.drop b{color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
.pri{flex:1;background:var(--acc);color:var(--acc-ink);font-weight:600}
.sec{background:var(--chip);color:var(--ink)}
button:disabled{opacity:.5}
#status{font-size:.88rem;color:var(--mute);margin-top:10px;min-height:1.2em}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.page img{max-width:100%;border-radius:10px;display:block;margin:0 auto 8px}
.item{border-top:1px solid var(--line);padding:10px 0}
.n{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;background:var(--acc);color:var(--acc-ink);font-size:.75rem;margin-right:6px}
.en{color:var(--mute);font-size:.86rem;overflow-wrap:anywhere}
.th{font-size:1.08rem;margin-top:4px;overflow-wrap:anywhere}
.note{font-size:.8rem;color:var(--mute);text-align:center}
</style>
</head>
<body>
<main>
  <h1>แปลการ์ตูน อังกฤษ → ไทย</h1>
  <p class="sub">ทำงานในเครื่อง ไม่ใช้ API ใช้ไม่จำกัด</p>

  <div class="card">
    <label class="drop" for="file">
      <span style="font-size:2rem">📖</span>
      <b>แตะเพื่อเลือกรูปการ์ตูน (เลือกได้หลายรูป)</b>
      <span id="count">ยังไม่ได้เลือกรูป</span>
    </label>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div class="row">
      <button class="pri" id="go" disabled>แปลเลย</button>
      <button class="sec" id="clear" disabled>ล้าง</button>
    </div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div id="status"></div>
  </div>

  <div id="results"></div>
  <p class="note">ครั้งแรกต้องโหลดโมเดลหลายร้อยเมกะไบต์ ควรใช้ Wi-Fi หลังจากนั้นใช้ออฟไลน์ได้</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

// ===== ตั้งค่า: เปลี่ยนโมเดลได้ตรงนี้ =====
const MODEL = 'Xenova/nllb-200-distilled-600M';
const SRC = 'eng_Latn', TGT = 'tha_Thai';
// =========================================

env.allowLocalModels = false;
env.useBrowserCache = true;

const $ = id => document.getElementById(id);
const fileEl = $('file'), go = $('go'), clearBtn = $('clear'), statusEl = $('status'),
      bar = $('bar'), fill = $('fill'), results = $('results'), count = $('count');
let files = [], translator = null, ocr = null;

function setStatus(t){ statusEl.textContent = t; }
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function progress(p){ bar.style.display = p == null ? 'none' : 'block'; if (p != null) fill.style.width = Math.round(p) + '%'; }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

fileEl.addEventListener('change', () => {
  files = Array.from(fileEl.files || []);
  count.textContent = files.length ? 'เลือกแล้ว ' + files.length + ' รูป' : 'ยังไม่ได้เลือกรูป';
  go.disabled = clearBtn.disabled = !files.length;
});
clearBtn.addEventListener('click', () => {
  files = []; fileEl.value = ''; results.innerHTML = ''; setStatus(''); progress(null);
  count.textContent = 'ยังไม่ได้เลือกรูป'; go.disabled = clearBtn.disabled = true;
});

// การ์ตูนมักเป็นตัวพิมพ์ใหญ่ทั้งหมด ซึ่งทำให้โมเดลแปลพลาด จึงแปลงเป็นตัวพิมพ์ปกติก่อน
function normalize(t){
  t = t.replace(/-\s*\n/g, '').replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
  const letters = t.replace(/[^A-Za-z]/g, '');
  if (letters.length > 3 && letters === letters.toUpperCase()) {
    t = t.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bi\b/g, 'I');
  }
  return t;
}

async function loadModels(){
  if (!ocr) {
    setStatus('กำลังเตรียมตัวอ่านข้อความ…');
    ocr = await Tesseract.createWorker('eng');
  }
  if (!translator) {
    setStatus('กำลังโหลดโมเดลแปลภาษา (ครั้งแรกใช้เวลานาน)…');
    progress(0);
    translator = await pipeline('translation', MODEL, {
      dtype: 'q8',
      progress_callback: d => { if (d.status === 'progress') progress(d.progress); }
    });
    progress(null);
  }
}

go.addEventListener('click', async () => {
  go.disabled = true; results.innerHTML = '';
  try {
    await loadModels();
    for (let i = 0; i < files.length; i++) {
      const url = URL.createObjectURL(files[i]);
      const box = document.createElement('div');
      box.className = 'card page';
      box.innerHTML = '<img src="' + url + '" alt=""><div class="body"></div>';
      results.appendChild(box);
      const body = box.querySelector('.body');

      setStatus('รูปที่ ' + (i + 1) + '/' + files.length + ': กำลังอ่านข้อความ…');
      const { data } = await ocr.recognize(files[i]);
      const parts = (data.text || '').split(/\n\s*\n/).map(normalize).filter(t => /[A-Za-z]{2,}/.test(t));
      if (!parts.length) { body.textContent = 'ไม่พบข้อความในรูปนี้'; continue; }

      for (let k = 0; k < parts.length; k++) {
        setStatus('รูปที่ ' + (i + 1) + '/' + files.length + ': กำลังแปล ' + (k + 1) + '/' + parts.length);
        const out = await translator(parts[k], { src_lang: SRC, tgt_lang: TGT, max_length: 256 });
        const th = out && out[0] ? out[0].translation_text : '';
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = '<div class="en"><span class="n">' + (k + 1) + '</span>' + esc(parts[k]) + '</div><div class="th">' + esc(th) + '</div>';
        body.appendChild(el);
      }
    }
    setStatus('เสร็จแล้ว');
  } catch (e) {
    console.error(e);
    setStatus('เกิดข้อผิดพลาด: ' + (e && e.message ? e.message : e));
    progress(null);
  } finally {
    go.disabled = !files.length;
  }
});
</script>
</body>
</html>
